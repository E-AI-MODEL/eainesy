name: EAInesy Z3 - 3-minute real solver soak
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/z3-soak.mjs'
      - '.github/workflows/z3-soak.yml'
      - 'src/lib/eainesy/z3-isolated.ts'
      - 'src/lib/eainesy/z3cert.ts'
      - 'scripts/z3-cert-worker.mjs'
permissions:
  contents: read
jobs:
  z3-timed-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile
      - name: Prepare unmodified production worker and isolated boundary
        run: |
          mkdir -p .next/standalone
          bun build ./src/lib/eainesy/z3cert.ts --target=node --format=esm --external z3-solver --outfile .next/standalone/z3-cert-core.mjs
          bun build ./src/lib/eainesy/z3-isolated.ts --target=node --format=esm --outfile .next/standalone/z3-isolated-core.mjs
          cp scripts/z3-cert-worker.mjs .next/standalone/z3-cert-worker.mjs
      - name: Three-minute real Z3 soak (CPU, queue, memory samples)
        run: node scripts/z3-soak.mjs
