name: NeSy ABC parallel - isolated research

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/nesy-abc/**"
      - "scripts/validate-nesy-abc-pilot.mjs"
      - "scripts/run-nesy-abc-main-offline.mjs"
      - "scripts/run-nesy-abc-review-lab.mjs"
      - "scripts/run-nesy-abc-process-turn-dev.mjs"
      - "tests/nesy-abc-main-bridge.test.ts"
      - "src/lib/eainesy/abc-shadow.ts"
      - "src/lib/eainesy/orchestrator.ts"
      - "tests/nesy-abc-shadow.test.ts"
      - "docs/EAInesy-ABC-main-parallel-isolation.md"
      - ".github/workflows/nesy-abc-parallel-main.yml"
  push:
    branches:
      - main
      - integrate/nesy-abc-parallel-main-2026-10-23
    paths:
      - "research/nesy-abc/**"
      - "scripts/validate-nesy-abc-pilot.mjs"
      - "scripts/run-nesy-abc-main-offline.mjs"
      - "scripts/run-nesy-abc-review-lab.mjs"
      - "scripts/run-nesy-abc-process-turn-dev.mjs"
      - "tests/nesy-abc-main-bridge.test.ts"
      - "src/lib/eainesy/abc-shadow.ts"
      - "src/lib/eainesy/orchestrator.ts"
      - "tests/nesy-abc-shadow.test.ts"
      - "docs/EAInesy-ABC-main-parallel-isolation.md"
      - ".github/workflows/nesy-abc-parallel-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Show Node runtime
        run: node --version
      - name: Validate DEV-only input corpus
        run: node scripts/validate-nesy-abc-pilot.mjs
      - name: Test P0 A B C isolated research modules
        run: node --test research/nesy-abc/*.test.mjs
      - name: Run 24-case automatic read-only comparison
        run: node scripts/run-nesy-abc-main-offline.mjs
      - name: Test B/C reviewer callbacks through local-only HTTP (scripted fixture, not an LLM)
        run: node scripts/run-nesy-abc-review-lab.mjs --ci-stub
      - name: Set up Bun for offline application pipeline tests
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies without external model access
        run: bun install --frozen-lockfile
      - name: Generate Prisma client for application imports
        env:
          DATABASE_URL: file:./nesy-abc-ci-only.db
        run: bun run db:generate
      - name: Test actual processTurn through read-only A B C bridge (mocked Z3)
        env:
          DATABASE_URL: file:./nesy-abc-ci-only.db
        run: bun test tests/nesy-abc-main-bridge.test.ts
      - name: Verify opt-in shadow cannot change P0 or leak user text
        env:
          DATABASE_URL: file:./nesy-abc-ci-only.db
        run: bun test tests/nesy-abc-shadow.test.ts
      - name: Replay 24 synthetic conversations through actual processTurn
        env:
          DATABASE_URL: file:./nesy-abc-ci-only.db
        run: bun --preload ./tests/support/preload.ts scripts/run-nesy-abc-process-turn-dev.mjs
      - name: Upload full offline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesy-abc-main-research-only
          path: |
            .research-output/nesy-abc-main/
            .research-output/nesy-abc/
            .research-output/nesy-abc-review-lab/
          if-no-files-found: warn
          retention-days: 30
