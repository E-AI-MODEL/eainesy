name: NeSy OpenAI API sandbox - manual only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run is free and uses no API key; connect makes at most two billed requests"
        type: choice
        required: true
        default: dry_run
        options:
          - dry_run
          - connect
      confirm_api_costs:
        description: "YES explicitly approves up to two OpenAI API requests on this run"
        type: choice
        required: true
        default: "NO"
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

concurrency:
  group: nesy-openai-sandbox-manual
  cancel-in-progress: false

jobs:
  sandbox:
    name: Isolated NeSy API sandbox - no production access
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: nesy-openai-sandbox
    steps:
      - name: Checkout repository (no persistent Git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test sandbox client without a secret or network
        run: node --test research/nesy-abc/openai-sandbox-client.test.mjs

      - name: Free dry-run with in-process dummy reviewer
        if: ${{ inputs.mode == 'dry_run' }}
        run: node scripts/run-nesy-openai-sandbox.mjs --dry-run

      - name: Require explicit paid-call consent
        if: ${{ inputs.mode == 'connect' }}
        env:
          APPROVED: ${{ inputs.confirm_api_costs }}
        run: |
          if [ "$APPROVED" != "YES" ]; then
            echo "Connection is disabled: choose YES to authorize at most two billed OpenAI calls."
            exit 1
          fi

      - name: Connect two sandbox reviewers with environment-scoped key
        if: ${{ inputs.mode == 'connect' }}
        env:
          NESY_OPENAI_SANDBOX_API_KEY: ${{ secrets.NESY_OPENAI_SANDBOX_API_KEY }}
          NESY_SANDBOX_EXPLICIT_CONSENT: TWO_CALLS_AUTHORIZED
        run: node scripts/run-nesy-openai-sandbox.mjs --connect

      - name: Attach key-free, text-free sandbox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesy-openai-sandbox-metadata
          path: .research-output/nesy-openai-sandbox/
          if-no-files-found: warn
          retention-days: 14
