name: EAInesy v2 - Clean reproducibility check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Clean install, tests, formal checks, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Checkout published repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Show toolchain
        run: |
          bun --version
          node --version
      - name: Clean dependency install (locked)
        id: install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        id: prisma
        run: bun run db:generate
      - name: Initialize empty demo schema
        id: schema
        run: bun run db:push
      - name: Bun unit and integration tests
        id: tests
        continue-on-error: true
        run: bun test
      - name: Formal regressions
        id: formal
        continue-on-error: true
        run: bun --preload ./tests/support/preload.ts scripts/regress-formal.ts
      - name: Fast synthetic evaluation
        id: eval
        continue-on-error: true
        run: bun --preload ./tests/support/preload.ts scripts/run-fast-eval.ts
      - name: Synthetic conversation scenarios
        id: scenarios
        continue-on-error: true
        run: bun --preload ./tests/support/preload.ts scripts/run-scenarios.ts
      - name: Database infrastructure contract test
        id: dbcontract
        continue-on-error: true
        run: bash tests/database-runtime-build.sh
      - name: ESLint of application source
        id: lint
        continue-on-error: true
        run: bunx eslint src --max-warnings=0
      - name: Application + research scripts TypeScript check
        id: typescript
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Actual Z3 WASM solver under Node
        id: z3node
        continue-on-error: true
        run: node scripts/z3-node-runtime-smoke.mjs
      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Report check status
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'EAInesy v2 reproducibility status:'
          echo "Install:       ${{ steps.install.outcome }}"
          echo "Prisma:        ${{ steps.prisma.outcome }}"
          echo "Database:      ${{ steps.schema.outcome }}"
          echo "Bun tests:     ${{ steps.tests.outcome }}"
          echo "Formal:        ${{ steps.formal.outcome }}"
          echo "Fast eval:     ${{ steps.eval.outcome }}"
          echo "Scenarios:     ${{ steps.scenarios.outcome }}"
          echo "DB contract:   ${{ steps.dbcontract.outcome }}"
          echo "Lint:          ${{ steps.lint.outcome }}"
          echo "TypeScript:    ${{ steps.typescript.outcome }}"
          echo "Z3/Node:       ${{ steps.z3node.outcome }}"
          echo "Build:         ${{ steps.build.outcome }}"
          for status in \
            '${{ steps.install.outcome }}' \
            '${{ steps.prisma.outcome }}' \
            '${{ steps.schema.outcome }}' \
            '${{ steps.tests.outcome }}' \
            '${{ steps.formal.outcome }}' \
            '${{ steps.eval.outcome }}' \
            '${{ steps.scenarios.outcome }}' \
            '${{ steps.dbcontract.outcome }}' \
            '${{ steps.lint.outcome }}' \
            '${{ steps.typescript.outcome }}' \
            '${{ steps.z3node.outcome }}' \
            '${{ steps.build.outcome }}'; do
            if [ "$status" != success ]; then exit 1; fi
          done
