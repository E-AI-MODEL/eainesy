name: NeSy ABC offline research lab

on:
  push:
    branches:
      - research/nesy-abc-prereg-2026-10-23
    paths:
      - "research/nesy-abc/**"
      - "tests/nesy-abc-real-turn.test.ts"
      - "scripts/validate-nesy-abc-pilot.mjs"
      - "scripts/run-nesy-abc-dev.mjs"
      - ".github/workflows/nesy-abc-dev-lab.yml"
  pull_request:
    branches:
      - sync/glm-research-2026-10-19
    paths:
      - "research/nesy-abc/**"
      - "tests/nesy-abc-real-turn.test.ts"
      - "scripts/validate-nesy-abc-pilot.mjs"
      - ".github/workflows/nesy-abc-dev-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lab:
    name: Offline architecture and pilot checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
    steps:
      - name: Checkout exact code
        uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Validate pilot fixture structure (offline)
        run: node scripts/validate-nesy-abc-pilot.mjs
      - name: Test P0 A B C research module (offline)
        run: node --test research/nesy-abc/*.test.mjs
      - name: Setup Bun for actual processTurn integration
        uses: oven-sh/setup-bun@v2
      - name: Install project dependencies (no external models)
        run: bun install --frozen-lockfile
      - name: Generate Prisma client for application module imports
        env:
          DATABASE_URL: file:./abc-offline-test.db
        run: bun run db:generate
      - name: Execute real NeSy pipeline and read-only research bridge
        env:
          DATABASE_URL: file:./abc-offline-test.db
        run: bun test tests/nesy-abc-real-turn.test.ts
      - name: Automated 24-case NeSy A/B/C DEV replay and reports
        env:
          DATABASE_URL: file:./abc-offline-test.db
        run: bun --preload ./tests/support/preload.ts scripts/run-nesy-abc-dev.mjs
      - name: Upload DEV comparison report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesy-abc-dev-report
          path: .research-output/nesy-abc/
          if-no-files-found: warn
          retention-days: 30
